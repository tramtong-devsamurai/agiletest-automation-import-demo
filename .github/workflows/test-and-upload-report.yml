
name: JUnit Test & Upload Report

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  BASE_URL: ${{ vars.BASE_URL }}
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  PROJECT_KEY: ${{ vars.PROJECT_KEY }}

jobs:
  junit-test-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JUnit test & generate report
        run: |
          mkdir -p reports
          yarn
          yarn junit-test

      - name: Verify JUnit report
        run: |
          test -s reports/junit-report.xml || {
            echo "JUnit report not found or empty!"
            exit 1
          }

      - name: Upload report to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit-report.xml
          if-no-files-found: error

      - name: Upload JUnit report to AgileTest IC
        run: |
          REQUEST_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${GITHUB_SHA}"

          echo "Request ID: ${REQUEST_ID}"

          curl --show-error --fail-with-body \
            -X POST \
            "${BASE_URL}?action=import&framework=junit&projectKey=${PROJECT_KEY}&requestId=${REQUEST_ID}" \
            -H "x-agiletest-client-id: ${CLIENT_ID}" \
            -H "x-agiletest-client-secret: ${CLIENT_SECRET}" \
            -H "Content-Type: application/xml" \
            --data-binary @reports/junit-report.xml
